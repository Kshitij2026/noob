name: Build NoobFree Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NoobFree source
        uses: actions/checkout@v4

      - name: Locate Android Project Directory
        id: locate
        run: |
          ls -la
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found anywhere in repository! Please upload the extracted NoobFree source files to the repository."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Found Android project at: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Installable Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK Artifact
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/NoobFree-debug.apk"

      - name: Downloadable NoobFree Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NoobFree-debug.apk
          path: NoobFree-debug.apk
