name: Build NoobFree Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract NoobFree-Source.zip
        run: |
          unzip -o NoobFree-Source.zip -d extracted_src
          ls -la extracted_src/NoobFree

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests
        working-directory: extracted_src/NoobFree
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Installable Debug APK
        working-directory: extracted_src/NoobFree
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK Artifact
        working-directory: extracted_src/NoobFree
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/NoobFree-debug.apk"

      - name: Downloadable NoobFree Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NoobFree-debug.apk
          path: NoobFree-debug.apk
